repos:
-   repo: https://github.com/ambv/black
    rev: 23.11.0
    hooks:
    - id: black
      language_version: python3
-   repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
    - id: flake8
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v1.7.0'
    hooks:
    - id: mypy
      args: [--no-strict-optional, --ignore-missing-imports]
      

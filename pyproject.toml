# Refer to - 
# https://github.com/pypa/sampleproject/blob/main/pyproject.toml and
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
# for examples and help.


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
name = "cthree"
version = "2.0"
description = "Toolset for control, calibration and characterization of physical systems"
readme = "README.md"
requires-python = "~=3.10"
authors = [{name="PGI-12"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Unix",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.23.0",
  "scipy>=1.9.0",
  "jax>=0.4.20",
  "jaxlib>=0.4.20"
]


[project.optional-dependencies]
dev = [
  "pytest>=7.2.0",
  "pre-commit>=3.3.1"
]
test = [
  "pytest>=7.2.0",
]
gpu = [
  "jax[cuda12]>=0.4.20",
]

[project.urls]
"Homepage" = "https://jugit.fz-juelich.de/pgi-12/projects/c3-update"
"Bug Reports" = "https://jugit.fz-juelich.de/pgi-12/projects/c3-update/-/issues"
"Source" = "https://jugit.fz-juelich.de/pgi-12/projects/c3-update"


# mypy configurations
[tool.mypy]
python_version = "~=3.10"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "bayes_opt.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cma.*"
ignore_missing_imports = true


# pytest's code coverage configurations
[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
  # Exclude abstract methods
  "raise NotImplementedError",
  "@(abc\.)?abstractmethod",
]

ignore_errors = true
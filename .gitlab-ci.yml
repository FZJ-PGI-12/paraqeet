# This file is a template, and might need editing before it works on your project.
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Python.gitlab-ci.yml

# Official language image. Look for the different tagged releases at:
# https://hub.docker.com/r/library/python/tags/
image: python:3.12

# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Pip's cache doesn't store the python packages
# https://pip.pypa.io/en/stable/topics/caching/
#
# If you want to also cache the installed packages, you have to install
# them in a virtualenv and cache it as well.
cache:
  paths:
    - .cache/pip
    - venv
    - .mypy_cache

stages:
  - codestyle
  - tests
  - docs

before_script:
  - python --version  # For debugging
  - pip install virtualenv
  - virtualenv venv
  - source venv/bin/activate
  - pip install pytest-cov pytest-xdist mypy mypy-gitlab-code-quality nbval
  - pip install -e ."[dev, testNB]"

test:
  stage: tests
  script:
    - pytest test -n 16 --cov=paraqeet --junitxml=report.xml  --cov-report term --cov-report xml:coverage.xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  tags: [heavy, docker]

codequality:
  stage: codestyle
  script:
    - pip install mypy mypy-gitlab-code-quality
    - mypy paraqeet --no-error-summary > mypy-out.txt || true # "|| true" is used for preventing job fail when mypy find errors
    - PYTHONHASHSEED=0 mypy-gitlab-code-quality < mypy-out.txt > mypy-report.json
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      codequality: mypy-report.json
  allow_failure: true
  tags: [docker, light]

formatting-and-linting:
  stage: codestyle
  script:
    - ruff check --output-format=gitlab . > ruff-report.json
  artifacts:
    reports:
      codequality: ruff-report.json
  allow_failure: true
  tags: [docker, light]


examples:
  stage: tests
  script:
    - pytest -n 8 --dist=loadscope --nbval-lax --junitxml=notebooks.xml examples/*.ipynb
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: notebooks.xml
  tags: [docker, medium]
  

build-docs:
  stage: docs
  script:
    - apt-get update
    - apt-get install -y pandoc
    - pip install sphinx sphinx-press-theme sphinx-pyproject nbsphinx sphinx-autoapi jupyter sphinx-autodoc-typehints recommonmark
    - for notebook in examples/*.ipynb; do jupyter nbconvert --execute --to rst --output-dir doc/notebooks $notebook; done
    - cd doc
    - sphinx-apidoc -o source ../paraqeet
    - make html
    - mv _build/html/ ../public/
  artifacts:
    paths:
      - public
  tags: [docker, medium]
  #rules:
  #  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
